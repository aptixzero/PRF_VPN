name: Config bridge

# ─────────────────────────────────────────────────────────────────────────────
# WHY THIS EXISTS
#
# Every config feed the app reads lives on raw.githubusercontent.com. That is a
# single hostname, and it is the one most aggressively DNS-poisoned on Iranian
# ISPs — so when it is blocked, the app has no source of configs at all, no
# matter how many feed URLs are in the list. Adding more feeds does not help
# when they all resolve to the same blocked host.
#
# This workflow aggregates the feeds on GitHub's own runners (which are never
# blocked) and republishes the result on hostnames that are NOT
# raw.githubusercontent.com, so the app has a second independent path to a
# config list.
#
# It publishes to TWO places, and the reason is worth keeping:
#
#   1. The `bridge` release, served from release-assets.githubusercontent.com.
#      This is the PRIMARY, because it works with no repository setting turned
#      on — the moment this workflow runs, the URLs are live.
#   2. The `gh-pages` branch, served from aptixzero.github.io. Pages is NOT
#      enabled on this repository today, so those URLs 404; the app lists them
#      second and treats the 404 as a normal dead source. Enabling Pages
#      (Settings -> Pages -> Source: branch `gh-pages`, folder /) upgrades the
#      app from one bridge host to two, with no app update needed.
#
# Neither destination touches `main`. See the publish steps for why.
#
# It is not a third-party intermediary: it is this account's own repository and
# own Pages domain, so the "no intermediaries" rule in AI_AGENT_GUIDE.md §5e is
# respected — no external relay, no CORS proxy, no mirror service ever sees a
# user request. The bridge is refreshed on a schedule, so a user request hits a
# static file and nothing is proxied live.
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    # Every 3 hours. Feeds rotate dead nodes out fairly quickly, and this keeps
    # the published snapshot fresh without hammering the upstream repositories.
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: config-bridge
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Aggregate feeds
        run: python3 bridge/aggregate.py

      # The aggregated lists are DATA, not source, and they are republished
      # every 3 hours. Committing them back to the repository added a
      # "chore(bridge): refresh aggregated configs" commit to main on every
      # run, which buried the actual release history under bot noise and grew
      # the repository without bound — in a repository whose stated purpose is
      # "intentionally limited to public runtime artifacts".
      #
      # So the workflow no longer writes to the git tree at all. It publishes
      # ONLY to the `bridge` release, which is exactly where the app reads
      # from, and which can be overwritten in place forever at no cost to the
      # history. That also means this workflow needs no write access to
      # contents beyond the release itself, and can never conflict with branch
      # protection on main.
      - name: Publish bridge release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh release view bridge --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create bridge --repo "$GITHUB_REPOSITORY" \
              --title "Config bridge (rolling)" \
              --notes "Rolling snapshot of aggregated configs, refreshed every 3 hours by .github/workflows/bridge.yml."
          gh release upload bridge \
            bridge/vless.txt bridge/vmess.txt bridge/status.json \
            --repo "$GITHUB_REPOSITORY" --clobber

      # Second host, same files. This targets the orphan `gh-pages` branch
      # rather than main, for the same reason as above: the snapshot is data
      # that changes every 3 hours and must not accumulate in the release
      # history. The branch is force-pushed as a single orphan commit, so it
      # never grows either.
      #
      # This step is harmless while Pages is disabled — it just maintains a
      # branch nobody serves yet. The day Pages is switched on for `gh-pages`,
      # the app's secondary bridge URLs start resolving with no app update.
      - name: Publish bridge to gh-pages
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf /tmp/pages && mkdir -p /tmp/pages/bridge
          cp bridge/vless.txt bridge/vmess.txt bridge/status.json /tmp/pages/bridge/
          # .nojekyll: without it Pages runs Jekyll, which can drop files.
          touch /tmp/pages/.nojekyll
          cd /tmp/pages
          git init -q -b gh-pages
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"
          git add -A
          git commit -q -m "bridge snapshot $(date -u +%FT%TZ)"
          git push -q --force origin gh-pages
